name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a newly published advisory or SAST rule surfaces even when
  # nothing is merged.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same gate the builder agent runs locally: prettier, eslint, tsc,
  # vitest, and semgrep/gitleaks over what the change touched.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - name: verify.sh
        env:
          # Pull requests are gated on their diff; main and scheduled runs
          # diff against themselves, which runs every gate.
          BASE: origin/${{ github.base_ref || github.ref_name }}
        run: bash .claude/scripts/verify.sh "$BASE"

  # Whole-repo scans, independent of the diff.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Dependency audit (high and critical)
        run: bash .claude/scripts/security.sh deps
      - name: Secrets (full history)
        run: bash .claude/scripts/security.sh secrets --base ''
      - name: SAST (semgrep)
        run: bash .claude/scripts/security.sh sast
      - name: Workflow lint (actionlint + zizmor)
        run: bash .claude/scripts/security.sh workflows
