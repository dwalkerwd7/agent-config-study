# Pinned so every worktree shares one set of containers and volumes. Without this,
# Compose names the project after the directory and each worktree gets its own
# database.
name: agent-config-study

services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-config-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent-config-study
      POSTGRES_PASSWORD: agent-config-study
      POSTGRES_DB: agent-config-study
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent-config-study -d agent-config-study']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-config-study-redis
    restart: unless-stopped
    # BullMQ requires this eviction policy so queue keys are never evicted.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
